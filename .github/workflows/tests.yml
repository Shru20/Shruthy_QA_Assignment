name: GitLab Issues API Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  schedule:
    - cron: '0 6 * * 1'   # Monday 06:00 UTC — catches upstream API drift
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Deliberately a single global group, not keyed on ref.
#
# The suite creates and deletes issues in one shared GitLab project, so
# concurrent runs would interleave writes: pagination, sort-order and
# iid-monotonicity assertions all assume no other run is mutating the
# project. Serialising every run is the cheapest way to guarantee that.
# It also satisfies the single-deployment requirement for Pages.
concurrency:
  group: gitlab-issues-api-tests
  cancel-in-progress: false

env:
  # Base URL is configuration, not a credential — a repository variable keeps
  # it visible in logs for debugging. Unset is fine: the suite defaults to
  # gitlab.com.
  GITLAB_API_BASE_URL: ${{ vars.GITLAB_API_BASE_URL }}

jobs:
  test:
    name: Run API Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Forks cannot read secrets, so the suite cannot authenticate. Skipping is
    # honest; running would fail at the credential check and look like a test
    # failure rather than a permissions boundary.
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name != 'pull_request'

    env:
      GITLAB_API_TOKEN: ${{ secrets.GITLAB_API_TOKEN }}
      GITLAB_API_PROJECT_ID: ${{ secrets.GITLAB_API_PROJECT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # BaseTest fails fast on missing config, but that surfaces as 40+ test
      # errors. Checking here produces one actionable annotation instead.
      - name: Verify required secrets are present
        run: |
          if [ -z "$GITLAB_API_TOKEN" ] || [ -z "$GITLAB_API_PROJECT_ID" ]; then
            echo "::error::Missing credentials. Add GITLAB_API_TOKEN and GITLAB_API_PROJECT_ID under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Run tests
        run: mvn -B -ntp clean test

      - name: Generate Allure HTML report
        if: always()
        run: mvn -B -ntp allure:report

      - name: Publish test results to the run summary
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: JUnit results
          path: target/surefire-reports/TEST-*.xml
          reporter: java-junit
          fail-on-error: false

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: target/allure-results
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports
          if-no-files-found: ignore
          retention-days: 14

      # Only the default branch publishes to Pages. Uploading from every branch
      # would let feature work and PRs overwrite the canonical report.
      - name: Upload Pages artifact
        if: always() && github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/site/allure-maven-plugin
          if-no-files-found: error

  deploy-report:
    name: Publish Allure Report to Pages
    needs: test
    # Runs on failure so a red report is still published, but not on cancel.
    if: ${{ !cancelled() && github.ref == 'refs/heads/master' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4